<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바코드 + 유통기한 + 발주</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#51606e;--acc:#0b6e4f;--err:#b3261e;--line:#c9d1d9;--warn:#e67e22;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px 14px 50px}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:11px 6px;border:0;border-radius:12px;background:#fff;font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--line)}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
section{display:none}
section.active{display:block}
#box{position:relative;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#guide{position:absolute;left:5%;right:5%;top:25%;bottom:25%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
button{font:inherit;cursor:pointer}
.big{width:100%;min-height:50px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:#fff;margin-top:10px}
.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.danger{background:var(--danger);color:#fff}
#msg,#emsg,#omsg{min-height:1.6em;margin:8px 0 0;font-size:14px}
.err{color:var(--err);font-weight:700}.ok{color:var(--acc);font-weight:700}
select,input{width:100%;min-height:46px;font-size:16px;padding:0 12px;border:2px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-top:10px;border:2px solid var(--line)}
.card.d3{border-color:var(--danger);background:#fdf2f2}
.card.d7{border-color:var(--warn);background:#fef9f3}
.card.d14{border-color:#f1c40f}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:700;padding:3px 7px;border-radius:8px;background:#eee}
.badge.d3{background:var(--danger);color:#fff}
.badge.d7{background:var(--warn);color:#fff}
.badge.d14{background:#f1c40f;color:#000}
.qty{font-size:19px;font-weight:800;color:var(--acc)}
.small{font-size:13px;color:var(--mut)}
.hidden{display:none !important}
ul{list-style:none;margin:8px 0 0;padding:0}
li button{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
#res{background:#fff;border:3px solid var(--acc);border-radius:16px;padding:16px;margin-top:14px;text-align:center}
#rcode{font-size:clamp(44px,16vw,72px);font-weight:800;color:var(--acc);margin:8px 0}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#14202b;color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.order-item{padding:12px 0;border-bottom:1px solid var(--line)}
.order-item:last-child{border-bottom:0}
.order-qty{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.order-qty button{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:700}
.unit-select{min-height:32px;font-size:13px;padding:0 8px;width:auto;margin:0}
.date-edit{font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;width:130px}
</style>
</head>
<body>
<main>
<h1>바코드 + 유통기한 + 발주</h1>

<div class="tabs">
  <button class="tab active" data-tab="scan">바코드 조회</button>
  <button class="tab" data-tab="expiry">유통기한</button>
  <button class="tab" data-tab="order">발주 요청</button>
</div>

<!-- 1. 바코드 조회 -->
<section id="tab-scan" class="active">
  <div id="box"><video id="v" playsinline webkit-playsinline muted autoplay></video><div id="guide"></div></div>
  <button id="start" class="big">카메라 켜기</button>
  <p id="msg">상품 데이터를 불러오는 중...</p>
  <p id="dbg" class="small"></p>

  <div id="res" class="hidden">
    <div id="rname" style="font-size:19px;font-weight:700"></div>
    <small>회사 앱에 입력할 제품 코드</small>
    <div id="rcode"></div>
    <button id="copy" class="big">제품 코드 복사</button>
    <p id="cnote"></p>
    <button id="again" class="big ghost">다시 스캔</button>
    <button id="addToExpiry" class="big" style="margin-top:8px">유통기한 등록으로</button>
  </div>

  <h2 style="font-size:17px;margin:22px 0 8px">직접 찾기</h2>
  <input id="q" type="search" placeholder="제품명 또는 바코드" disabled>
  <p id="qmsg"></p>
  <ul id="list"></ul>
  <p id="cnt" class="small"></p>
</section>

<!-- 2. 유통기한 -->
<section id="tab-expiry">
  <label>사원</label>
  <select id="emp"><option value="">사원 선택</option></select>
  <label>대리점</label>
  <select id="agency" disabled><option value="">대리점 선택</option></select>
  <label>매장 (2차점)</label>
  <select id="store" disabled><option value="">매장 선택</option></select>
  <label>또는 매장명 직접 입력</label>
  <input id="storeCustom" type="text" placeholder="조직도에 없는 매장명 입력">

  <div id="storeInfo" class="hidden" style="margin-top:16px">
    <div class="row">
      <strong id="storeTitle"></strong>
      <button id="btnAdd" class="big" style="width:auto;padding:8px 14px;margin:0;font-size:14px">+ 제품 추가</button>
    </div>
    <p id="emsg" class="small"></p>
    <div id="expiryList"></div>
  </div>

  <div id="addPanel" class="card hidden" style="margin-top:14px">
    <strong>제품 추가</strong>
    <input id="addSearch" type="search" placeholder="제품명 또는 바코드 검색">
    <ul id="addList"></ul>
    <label>유통기한</label>
    <input id="addDate" type="date">
    <label>수량</label>
    <input id="addQty" type="number" min="1" value="1">
    <button id="btnSaveAdd" class="big">저장</button>
    <button id="btnCancelAdd" class="big ghost">취소</button>
  </div>
</section>

<!-- 3. 발주 요청 -->
<section id="tab-order">
  <label>사원</label>
  <select id="o_emp"><option value="">사원 선택</option></select>
  <label>대리점</label>
  <select id="o_agency" disabled><option value="">대리점 선택</option></select>
  <label>매장 (2차점)</label>
  <select id="o_store" disabled><option value="">매장 선택</option></select>
  <label>또는 매장명 직접 입력</label>
  <input id="o_storeCustom" type="text" placeholder="조직도에 없는 매장명 입력">

  <div id="orderArea" class="hidden" style="margin-top:16px">
    <div class="row">
      <strong id="orderStoreTitle"></strong>
      <button id="btnOrderAdd" class="big" style="width:auto;padding:8px 14px;margin:0;font-size:14px">+ 제품 추가</button>
    </div>
    <div id="orderList" class="card" style="margin-top:12px;min-height:60px">
      <p class="small" style="margin:0;text-align:center">아직 담긴 제품이 없습니다</p>
    </div>
    <button id="btnCopyOrder" class="big">카톡용 텍스트 복사</button>
    <button id="btnClearOrder" class="big ghost">목록 비우기</button>
    <p id="omsg" class="small"></p>
  </div>

  <div id="orderAddPanel" class="card hidden" style="margin-top:14px">
    <strong>발주 제품 추가</strong>
    <input id="o_search" type="search" placeholder="제품명 또는 바코드 검색">
    <ul id="o_list"></ul>
    <label>수량 유형</label>
    <select id="o_unit">
      <option value="qty">수량 (개)</option>
      <option value="box">박스</option>
      <option value="soldout">품절</option>
      <option value="none">품목만 (수량 없음)</option>
    </select>
    <div id="o_qtyWrap">
      <label>수량</label>
      <input id="o_qty" type="number" min="1" value="1">
    </div>
    <button id="btnOrderSave" class="big">담기</button>
    <button id="btnOrderCancel" class="big ghost">취소</button>
  </div>
</section>
</main>

<div id="toast">저장되었습니다</div>

<script>
const PRODUCT_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTk2c--28hH4VkUe84z4rkFIdL_qACQt_vSyLsvDjSqYw8b6eJFLcRPTzK0eWC1ue4OsVKPL5UclV2U/pub?output=csv';
const ORG_CSV     = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQODEz9RyQlO5e40idNtJ5vPOLpcCPs4tmpZwuROBjKI2mPs9AUzeVJOyT9PsRBWzD8Vxya5dR24-Bj/pub?output=csv';
const STOCK_CSV   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1S4DfOszr0CX5KI0ud2T6pK786qESXmiO8bHaXaDQyUtJEi01oW_VIthc8Q7gmmIM2BPN2bKRWY1-/pub?output=csv';
const PREFIX = '8801005';
const LOCAL_KEY = 'expiry_stock_v1';
const ORDER_KEY = 'order_temp_v1';

const $ = id => document.getElementById(id);
const msg = (t,c)=>{ $('msg').textContent=t; $('msg').className=c||''; };
const emsg = (t,c)=>{ $('emsg').textContent=t; $('emsg').className=c||''; };
const omsg = (t,c)=>{ $('omsg').textContent=t; $('omsg').className=c||''; };
const digits = s => String(s||'').replace(/\D/g,'');

function showToast(text='저장되었습니다'){
  const t=$('toast'); t.textContent=text; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function parseCSV(text){
  const rows=[];
  text.trim().split(/\r?\n/).forEach((line,i)=>{
    if(i===0) return;
    const cols=[]; let cur='',q=false;
    for(let j=0;j<line.length;j++){
      const ch=line[j];
      if(ch==='"'){q=!q;continue;}
      if(ch===','&&!q){cols.push(cur.trim());cur='';continue;}
      cur+=ch;
    }
    cols.push(cur.trim());
    if(cols.length) rows.push(cols);
  });
  return rows;
}

function daysLeft(dateStr){
  if(!dateStr) return 9999;
  const d=new Date(dateStr);
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.ceil((d-today)/86400000);
}

function formatUnit(item){
  if(item.unit==='soldout') return '품절';
  if(item.unit==='none') return '';
  if(item.unit==='box') return (item.qty||1)+'박스';
  return (item.qty||1)+'개';
}

let PRODUCTS=[], byFull=new Map(), byCode=new Map(), ORG=[], STOCK=[], ORDER=[];

function loadLocal(){ try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');}catch(e){return[];} }
function saveLocal(data){ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }
function loadOrder(){ try{return JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');}catch(e){return[];} }
function saveOrder(data){ localStorage.setItem(ORDER_KEY, JSON.stringify(data)); ORDER=data; }

async function init(){
  try{
    msg('데이터를 불러오는 중...');
    const [pText,oText,sText] = await Promise.all([
      fetch(PRODUCT_CSV+'&_='+Date.now()).then(r=>r.text()),
      fetch(ORG_CSV+'&_='+Date.now()).then(r=>r.text()),
      fetch(STOCK_CSV+'&_='+Date.now()).then(r=>r.text()).catch(()=>'')
    ]);

    PRODUCTS = parseCSV(pText).map(r=>{
      const code = digits(r[0]).slice(-6);
      return [code, r[1]||''];
    }).filter(x=>x[0].length===6);
    byFull = new Map(PRODUCTS.map(([c,n])=>[PREFIX+c,{code:c,name:n}]));
    byCode = new Map(PRODUCTS.map(([c,n])=>[c,{code:c,name:n}]));
    $('cnt').textContent = '등록 상품 '+PRODUCTS.length+'개';
    $('q').disabled = false;

    ORG = parseCSV(oText).map(r=>({emp:r[0]||'',agency:r[1]||'',store:r[2]||''})).filter(x=>x.emp);

    const sheetStock = parseCSV(sText).map(r=>({
      emp:r[0]||'',agency:r[1]||'',store:r[2]||'',
      code:digits(r[3]).slice(-6), name:r[4]||'', expiry:r[5]||'',
      qty:parseInt(r[6])||0, source:'sheet'
    })).filter(x=>x.code);
    STOCK = mergeStock(sheetStock, loadLocal());
    ORDER = loadOrder();

    buildEmpSelect('emp');
    buildEmpSelect('o_emp');
    msg('카메라를 켜고 바코드를 네모 칸에 맞추세요.');
  }catch(e){
    console.error(e);
    msg('데이터를 불러오지 못했습니다.','err');
  }
}

function mergeStock(sheet, local){
  const map=new Map();
  sheet.forEach(s=>map.set([s.emp,s.agency,s.store,s.code,s.expiry].join('|'),s));
  local.forEach(s=>map.set([s.emp,s.agency,s.store,s.code,s.expiry].join('|'),{...s,source:'local'}));
  return [...map.values()];
}

function buildEmpSelect(id){
  const emps=[...new Set(ORG.map(o=>o.emp))].sort();
  const sel=$(id);
  sel.innerHTML='<option value="">사원 선택</option>';
  emps.forEach(e=>{ const o=document.createElement('option'); o.value=e; o.textContent=e; sel.appendChild(o); });
}

function getStoreName(selectId, customId){
  const custom = $(customId).value.trim();
  if(custom) return custom;
  return $(selectId).value;
}

function setupOrgSelect(empId, agencyId, storeId, customId, areaId, titleId, onShow){
  $(empId).onchange = ()=>{
    const emp = $(empId).value;
    const agencies = [...new Set(ORG.filter(o=>o.emp===emp).map(o=>o.agency))].sort();
    const sel=$(agencyId);
    sel.innerHTML='<option value="">대리점 선택</option>';
    agencies.forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent=a; sel.appendChild(o); });
    sel.disabled=!emp;
    $(storeId).innerHTML='<option value="">매장 선택</option>';
    $(storeId).disabled=true;
    $(customId).value='';
    $(areaId).classList.add('hidden');
  };
  $(agencyId).onchange = ()=>{
    const emp=$(empId).value, agency=$(agencyId).value;
    const stores=[...new Set(ORG.filter(o=>o.emp===emp&&o.agency===agency).map(o=>o.store))].sort();
    const sel=$(storeId);
    sel.innerHTML='<option value="">매장 선택</option>';
    stores.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
    sel.disabled=!agency;
    $(customId).value='';
    $(areaId).classList.add('hidden');
  };
  $(storeId).onchange = ()=>{ $(customId).value=''; checkShow(); };
  $(customId).oninput = ()=>{ if($(customId).value.trim()) $(storeId).value=''; checkShow(); };
  function checkShow(){
    const name = getStoreName(storeId, customId);
    if(name){
      $(areaId).classList.remove('hidden');
      $(titleId).textContent = name;
      if(onShow) onShow();
    } else $(areaId).classList.add('hidden');
  }
}

setupOrgSelect('emp','agency','store','storeCustom','storeInfo','storeTitle', renderExpiryList);
setupOrgSelect('o_emp','o_agency','o_store','o_storeCustom','orderArea','orderStoreTitle', renderOrderList);

// ===== 유통기한 =====
function renderExpiryList(){
  const emp=$('emp').value;
  const agency=$('agency').value || '-';
  const store=getStoreName('store','storeCustom');
  let list=STOCK.filter(s=>s.emp===emp && (s.agency===agency||agency==='-') && s.store===store && s.qty>0);
  list.sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry));
  const box=$('expiryList'); box.innerHTML='';
  if(!list.length){ emsg('등록된 제품이 없습니다.'); return; }
  emsg(list.length+'개 제품');
  list.forEach((item,idx)=>{
    const left=daysLeft(item.expiry);
    let cls='',badgeCls='';
    if(left<=3){cls='d3';badgeCls='d3';} else if(left<=7){cls='d7';badgeCls='d7';} else if(left<=14){cls='d14';badgeCls='d14';}
    const div=document.createElement('div');
    div.className='card '+cls;
    div.innerHTML=`
      <div class="row">
        <div style="flex:1">
          <div style="font-weight:700">${item.name||item.code}</div>
          <div class="small">코드 ${item.code}</div>
          <div style="margin-top:6px">
            <input type="date" class="date-edit" value="${item.expiry||''}" data-idx="${idx}">
          </div>
        </div>
        <div style="text-align:right">
          <div class="badge ${badgeCls}">${left<0?'만료':'D-'+left}</div>
          <div class="qty" style="margin-top:4px">${item.qty}</div>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" style="flex:1;padding:8px;border-radius:8px;border:2px solid var(--line);background:#fff" data-idx="${idx}" data-act="minus">-</button>
        <button class="ghost" style="flex:1;padding:8px;border-radius:8px;border:2px solid var(--line);background:#fff" data-idx="${idx}" data-act="plus">+</button>
        <button class="danger" style="flex:1;padding:8px;border-radius:8px;border:0" data-idx="${idx}" data-act="del">삭제</button>
      </div>`;
    box.appendChild(div);
  });

  box.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      const item=list[+btn.dataset.idx];
      if(btn.dataset.act==='plus') item.qty++;
      if(btn.dataset.act==='minus') item.qty=Math.max(0,item.qty-1);
      if(btn.dataset.act==='del') item.qty=0;
      updateStockItem(item);
      renderExpiryList();
      showToast('저장되었습니다');
    };
  });

  box.querySelectorAll('.date-edit').forEach(inp=>{
    inp.onchange=()=>{
      const item=list[+inp.dataset.idx];
      const oldKey=[item.emp,item.agency,item.store,item.code,item.expiry].join('|');
      item.expiry = inp.value;
      const local=loadLocal().filter(s=>[s.emp,s.agency,s.store,s.code,s.expiry].join('|')!==oldKey);
      if(item.qty>0) local.push({...item,source:'local'});
      saveLocal(local);
      STOCK=mergeStock(STOCK.filter(s=>s.source==='sheet'),local);
      renderExpiryList();
      showToast('유통기한이 수정되었습니다');
    };
  });
}

function updateStockItem(item){
  const local=loadLocal().filter(s=>!(s.emp===item.emp&&s.agency===item.agency&&s.store===item.store&&s.code===item.code&&s.expiry===item.expiry));
  if(item.qty>0) local.push({...item,source:'local'});
  saveLocal(local);
  STOCK=mergeStock(STOCK.filter(s=>s.source==='sheet'),local);
}

let selectedAddProduct=null;
$('btnAdd').onclick=()=>{ $('addPanel').classList.remove('hidden'); $('addSearch').value=''; $('addList').innerHTML=''; $('addDate').value=''; $('addQty').value=1; selectedAddProduct=null; };
$('btnCancelAdd').onclick=()=>$('addPanel').classList.add('hidden');
$('addSearch').oninput=()=>{
  const q=$('addSearch').value.trim().toLowerCase();
  const ul=$('addList'); ul.innerHTML='';
  if(q.length<1) return;
  PRODUCTS.filter(([c,n])=>c.includes(q)||n.toLowerCase().includes(q)).slice(0,15).forEach(([c,n])=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.innerHTML=`<b>${n}</b><span class="small">코드 ${c}</span>`;
    b.onclick=()=>{ selectedAddProduct={code:c,name:n}; $('addSearch').value=n; ul.innerHTML=''; };
    li.appendChild(b); ul.appendChild(li);
  });
};
$('btnSaveAdd').onclick=()=>{
  if(!selectedAddProduct){alert('제품을 선택해주세요');return;}
  const expiry=$('addDate').value, qty=parseInt($('addQty').value)||0;
  if(!expiry||qty<1){alert('유통기한과 수량을 입력해주세요');return;}
  const store=getStoreName('store','storeCustom');
  const local=loadLocal();
  local.push({
    emp:$('emp').value, agency:$('agency').value||'-', store,
    code:selectedAddProduct.code, name:selectedAddProduct.name,
    expiry, qty, source:'local'
  });
  saveLocal(local);
  STOCK=mergeStock(STOCK.filter(s=>s.source==='sheet'),local);
  $('addPanel').classList.add('hidden');
  renderExpiryList();
  showToast('저장되었습니다');
};

// ===== 발주 =====
function renderOrderList(){
  const box=$('orderList');
  if(!ORDER.length){
    box.innerHTML='<p class="small" style="margin:0;text-align:center">아직 담긴 제품이 없습니다</p>';
    return;
  }
  box.innerHTML='';
  ORDER.forEach((item,idx)=>{
    const div=document.createElement('div');
    div.className='order-item';
    const unitText = formatUnit(item);
    div.innerHTML=`
      <div style="font-weight:700">${item.name}</div>
      <div class="small">코드 ${item.code}${unitText ? ' · '+unitText : ''}</div>
      <div class="order-qty">
        <select class="unit-select" data-idx="${idx}">
          <option value="qty" ${item.unit==='qty'?'selected':''}>수량</option>
          <option value="box" ${item.unit==='box'?'selected':''}>박스</option>
          <option value="soldout" ${item.unit==='soldout'?'selected':''}>품절</option>
          <option value="none" ${item.unit==='none'?'selected':''}>품목만</option>
        </select>
        <button data-idx="${idx}" data-act="minus" ${item.unit==='soldout'||item.unit==='none'?'disabled':''}>-</button>
        <span style="font-weight:800;min-width:22px;text-align:center">${item.unit==='soldout'||item.unit==='none'?'-':(item.qty||1)}</span>
        <button data-idx="${idx}" data-act="plus" ${item.unit==='soldout'||item.unit==='none'?'disabled':''}>+</button>
        <button data-idx="${idx}" data-act="del" style="color:var(--danger);border-color:var(--danger)">×</button>
      </div>`;
    box.appendChild(div);
  });

  box.querySelectorAll('.unit-select').forEach(sel=>{
    sel.onchange=()=>{
      const item=ORDER[+sel.dataset.idx];
      item.unit = sel.value;
      if(item.unit==='soldout'||item.unit==='none') item.qty=0;
      else if(!item.qty) item.qty=1;
      saveOrder(ORDER);
      renderOrderList();
    };
  });

  box.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      const idx=+btn.dataset.idx;
      if(btn.dataset.act==='plus') ORDER[idx].qty++;
      if(btn.dataset.act==='minus') ORDER[idx].qty=Math.max(1,ORDER[idx].qty-1);
      if(btn.dataset.act==='del') ORDER.splice(idx,1);
      saveOrder(ORDER);
      renderOrderList();
    };
  });
}

// 수량 유형 변경 시 입력칸 보이기/숨기기
$('o_unit').onchange = ()=>{
  const u = $('o_unit').value;
  $('o_qtyWrap').style.display = (u==='soldout'||u==='none') ? 'none' : 'block';
};

let selectedOrderProduct=null;
$('btnOrderAdd').onclick=()=>{
  $('orderAddPanel').classList.remove('hidden');
  $('o_search').value=''; $('o_list').innerHTML='';
  $('o_unit').value='qty'; $('o_qty').value=1;
  $('o_qtyWrap').style.display='block';
  selectedOrderProduct=null;
};
$('btnOrderCancel').onclick=()=>$('orderAddPanel').classList.add('hidden');
$('o_search').oninput=()=>{
  const q=$('o_search').value.trim().toLowerCase();
  const ul=$('o_list'); ul.innerHTML='';
  if(q.length<1) return;
  PRODUCTS.filter(([c,n])=>c.includes(q)||n.toLowerCase().includes(q)).slice(0,15).forEach(([c,n])=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.innerHTML=`<b>${n}</b><span class="small">코드 ${c}</span>`;
    b.onclick=()=>{ selectedOrderProduct={code:c,name:n}; $('o_search').value=n; ul.innerHTML=''; };
    li.appendChild(b); ul.appendChild(li);
  });
};
$('btnOrderSave').onclick=()=>{
  if(!selectedOrderProduct){alert('제품을 선택해주세요');return;}
  const unit = $('o_unit').value;
  const qty = (unit==='soldout'||unit==='none') ? 0 : (parseInt($('o_qty').value)||1);
  const exist=ORDER.find(o=>o.code===selectedOrderProduct.code);
  if(exist){
    exist.unit = unit;
    exist.qty = qty;
  } else {
    ORDER.push({code:selectedOrderProduct.code, name:selectedOrderProduct.name, qty, unit});
  }
  saveOrder(ORDER);
  $('orderAddPanel').classList.add('hidden');
  renderOrderList();
  showToast('담았습니다');
};

$('btnCopyOrder').onclick=async()=>{
  if(!ORDER.length){ omsg('담은 제품이 없습니다.','err'); return; }
  const store=getStoreName('o_store','o_storeCustom');
  let text=`[발주 요청]\n매장: ${store}\n--------------------\n`;
  ORDER.forEach(o=>{
    const unitStr = formatUnit(o);
    text += unitStr ? `${o.code}  ${o.name}  ${unitStr}\n` : `${o.code}  ${o.name}\n`;
  });
  text+=`--------------------\n총 ${ORDER.length}품목`;
  try{
    await navigator.clipboard.writeText(text);
    omsg('복사되었습니다. 카톡에 붙여넣기 하세요.','ok');
    showToast('카톡용 텍스트 복사 완료');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    omsg('복사되었습니다. 카톡에 붙여넣기 하세요.','ok');
    showToast('카톡용 텍스트 복사 완료');
  }
};

$('btnClearOrder').onclick=()=>{
  if(!ORDER.length) return;
  if(confirm('발주 목록을 모두 비울까요?')){
    ORDER=[]; saveOrder(ORDER); renderOrderList(); showToast('목록을 비웠습니다');
  }
};

// 바코드 스캔
const ZX_SRC=['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'];
let stream=null,scanning=false,bd=null,zx=null,zxLoading=false,t0=0,last='',streak=0;
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});

function loadZX(){
  if(zx||zxLoading)return; zxLoading=true;
  (async()=>{
    for(const s of ZX_SRC){
      try{
        await new Promise((ok,no)=>{const e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
        if(window.ZXing){
          const r=new ZXing.MultiFormatReader();
          r.setHints(new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]],[ZXing.DecodeHintType.TRY_HARDER,true]]));
          zx=r;break;
        }
      }catch(e){}
    }
    zxLoading=false;
  })();
}
async function initBD(){
  if(bd!==null)return; bd=false;
  try{ if('BarcodeDetector' in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('ean_13')) bd=new BarcodeDetector({formats:['ean_13']}); } }catch(e){}
  if(!bd) loadZX();
}
function ean13ok(s){
  if(!/^\d{13}$/.test(s))return false;
  const d=[...s].map(Number); let t=0;
  for(let i=0;i<12;i++) t+=d[i]*(i%2?3:1);
  return (10-t%10)%10===d[12];
}
async function startCam(){
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){ msg('카메라는 https에서만 가능합니다.','err'); return; }
  try{
    if(!stream){
      try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
      catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
      const v=$('v'); v.srcObject=stream; v.muted=true;
      v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    }
    await $('v').play();
  }catch(e){ msg('카메라를 켤 수 없습니다.','err'); return; }
  await initBD();
  scanning=true; t0=Date.now(); last=''; streak=0;
  $('start').hidden=true;
  msg('바코드를 네모 칸에 맞추세요.');
  tick();
}
function stopScan(){ scanning=false; try{$('v').pause()}catch(e){} }
async function readBD(v){ const r=await bd.detect(v); for(const b of r){ const d=digits(b.rawValue); if(d.length===13) return d; } return null; }
function readZX(v){
  const W=v.videoWidth,H=v.videoHeight,sw=Math.round(W*.9),sh=Math.round(H*.5),k=Math.min(1,1000/sw);
  cv.width=Math.round(sw*k); cv.height=Math.round(sh*k);
  cx.drawImage(v,(W-sw)>>1,(H-sh)>>1,sw,sh,0,0,cv.width,cv.height);
  try{ const b=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv))); return digits(zx.decode(b).getText()); }
  catch(e){ return null; }
}
async function tick(){
  if(!scanning) return;
  const v=$('v'); let code=null;
  if(v.readyState>=2&&v.videoWidth){
    try{ if(bd) code=await readBD(v); }catch(e){ bd=false; loadZX(); }
    if(!code&&zx) code=readZX(v);
    if(!code&&!zx&&Date.now()-t0>5000) loadZX();
  }
  if(code) onRead(code);
  if(scanning) setTimeout(tick,120);
}
function onRead(c){
  if(!ean13ok(c)) return;
  if(c===last) streak++; else { last=c; streak=1; }
  $('dbg').textContent='읽은 값: '+c;
  if(streak<2) return;
  const p=byFull.get(c);
  if(p){ if(navigator.vibrate) navigator.vibrate(60); showResult(p); }
  else { last=''; streak=0; msg('등록되지 않은 바코드입니다 ('+c+')','err'); }
}
function showResult(p){
  stopScan();
  $('rname').textContent=p.name;
  $('rcode').textContent=p.code;
  $('cnote').textContent='';
  $('res').classList.remove('hidden');
  msg('');
  $('res').scrollIntoView({behavior:'smooth'});
}
$('start').onclick=startCam;
$('again').onclick=()=>{ $('res').classList.add('hidden'); $('dbg').textContent=''; startCam(); };
$('copy').onclick=async()=>{
  const t=$('rcode').textContent;
  try{ await navigator.clipboard.writeText(t); $('cnote').textContent=t+' 복사됨'; $('cnote').className='ok'; }
  catch(e){ $('cnote').textContent='복사 실패'; $('cnote').className='err'; }
};
$('addToExpiry').onclick=()=>{
  document.querySelector('.tab[data-tab="expiry"]').click();
  alert('유통기한 탭으로 이동했습니다.\n매장 선택 후 "+ 제품 추가"를 눌러주세요.');
};

$('q').oninput=()=>{
  const q=$('q').value.trim();
  $('qmsg').textContent=''; $('list').innerHTML='';
  if(!q) return;
  const flat=q.replace(/[\s-]/g,'');
  let hits=[];
  if(/^\d+$/.test(flat)){
    if(flat.length===13||flat.length===6){
      const p=flat.length===13?byFull.get(flat):byCode.get(flat);
      if(p) hits=[p];
    } else if(flat.length>=3) hits=[...byFull].filter(([f])=>f.includes(flat)).map(x=>x[1]);
  } else {
    const tk=q.toLowerCase().split(/\s+/);
    hits=PRODUCTS.filter(([c,n])=>tk.every(t=>n.toLowerCase().replace(/\s+/g,'').includes(t))).map(([c,n])=>({code:c,name:n}));
  }
  if(!hits.length){ $('qmsg').textContent='검색 결과 없음'; $('qmsg').className='err'; return; }
  hits.slice(0,25).forEach(p=>{
    const li=document.createElement('li');
    const b=document.createElement('button');
    b.innerHTML=`<b>${p.name}</b><span class="small">코드 ${p.code}</span>`;
    b.onclick=()=>showResult(p);
    li.appendChild(b); $('list').appendChild(li);
  });
};

init();
