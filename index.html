<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바코드 제품코드 조회</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#51606e;--acc:#0b6e4f;--err:#b3261e;--line:#c9d1d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 -apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px 14px 40px}
#box{position:relative;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#guide{position:absolute;left:5%;right:5%;top:25%;bottom:25%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
button{font:inherit;cursor:pointer}
.big{width:100%;min-height:60px;font-size:22px;font-weight:700;border:0;border-radius:14px;background:var(--acc);color:#fff;margin-top:10px}
.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
#msg{min-height:2.8em;margin:8px 0 0}
.err{color:var(--err);font-weight:700}.ok{color:var(--acc);font-weight:700}
#dbg,#cnt{font-size:13px;color:var(--mut);margin:2px 0}
#res{background:#fff;border:3px solid var(--acc);border-radius:16px;padding:16px;margin-top:14px;text-align:center}
#res small{color:var(--mut)}
#rname{font-size:24px;font-weight:700;word-break:keep-all}
#rcode{font-size:clamp(60px,22vw,104px);font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--acc);line-height:1.1;margin:8px 0;-webkit-user-select:all;user-select:all}
#cnote{min-height:1.5em;margin:8px 0 0}
h2{font-size:20px;margin:26px 0 8px}
input{width:100%;min-height:56px;font-size:20px;padding:0 14px;border:2px solid var(--line);border-radius:12px}
ul{list-style:none;margin:8px 0 0;padding:0}
li button{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;color:var(--ink)}
li b{display:block;font-size:18px}li span{color:var(--mut);font-size:15px}
</style>
</head>
<body>
<main>
<p id="js" style="background:#fde8e6;color:#b3261e;padding:10px;border-radius:10px;font-weight:700">⚠ 자바스크립트가 실행되지 않았습니다. 이 문구가 계속 보이면 알려주세요.</p>
<section>
<div id="box"><video id="v" playsinline webkit-playsinline muted autoplay></video><div id="guide"></div></div>
<button id="start" class="big">카메라 켜기</button>
<p id="msg" role="status">카메라를 켜고 바코드를 네모 칸에 맞추세요.</p>
<p id="dbg"></p>
</section>

<section id="res" hidden>
<div id="rname"></div>
<small>회사 앱에 입력할 제품 코드</small>
<div id="rcode"></div>
<button id="copy" class="big">제품 코드 복사</button>
<p id="cnote" role="status"></p>
<button id="again" class="big ghost">다시 스캔</button>
</section>

<section>
<h2>직접 찾기</h2>
<input id="q" type="search" inputmode="search" autocomplete="off" placeholder="제품명 또는 바코드 숫자">
<p id="qmsg"></p>
<ul id="list"></ul>
<p id="cnt"></p>
</section>
</main>

\msg('카메라 권한이 꺼져 있습니다. 갤럭시: 주소창 왼쪽 자물쇠 > 권한 > 카메라 허용. 아이폰: 주소창 aA > 웹사이트 설정 > 카메라 허용 (또는 설정 > Safari > 카메라). 허용 후 새로고침하세요.','err');
else if(n==='NotFoundError'||n==='OverconstrainedError')msg('사용 가능한 카메라를 찾지 못했습니다. 아래 직접 찾기를 사용하세요.','err');
else if(n==='NotReadableError')msg('다른 앱이 카메라를 쓰고 있습니다. 그 앱을 닫고 다시 눌러 주세요.','err');
else msg('카메라를 켜지 못했습니다. ('+(n||'오류')+') 아래 직접 찾기를 사용하세요.','err');
}

async function startCam(){
if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
\msg('카메라는 https 주소에서만 켜집니다. 주소가 https로 시작하는지 확인하세요. 아래 직접 찾기는 사용할 수 있습니다.','err');return;
}
try{
\if(!stream){
\try{
\stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
}catch(e){
\stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
}
\const v=$('v');
\v.srcObject=stream;
\v.setAttribute('playsinline','');
\v.setAttribute('webkit-playsinline','');
\v.muted=true;
\try{
\const tr=stream.getVideoTracks()[0],c=tr.getCapabilities&&tr.getCapabilities();
\if(c&&c.focusMode&&c.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
}catch(e){}
}
\await $('v').play();
}catch(e){camError(e);return}
await initBD();
scanning=true;t0=Date.now();last='';streak=0;
$('start').hidden=true;
msg('바코드를 네모 칸 안에 맞추세요. 흔들리지 않게 잠깐 멈추세요.');
tick();
}

function stopScan(){scanning=false;try{$('v').pause()}catch(e){}}

async function readBD(v){
const r=await bd.detect(v);
for(const b of r){const d=digits(b.rawValue);if(d.length===13)return d}
return null;
}
function readZX(v){
const W=v.videoWidth,H=v.videoHeight,sw=Math.round(W*.9),sh=Math.round(H*.5),k=Math.min(1,1000/sw);
cv.width=Math.round(swk);cv.height=Math.round(shk);
cx.drawImage(v,(W-sw)>>1,(H-sh)>>1,sw,sh,0,0,cv.width,cv.height);
try{
\const b=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
\return digits(zx.decode(b).getText());
}catch(e){return null}
}

async function tick(){
if(!scanning)return;
const v=$('v');let code=null;
if(v.readyState>=2&&v.videoWidth){
\try{if(bd)code=await readBD(v)}catch(e){bd=false;loadZX()}
\if(!code&&zx)code=readZX(v);
\if(!code&&!zx&&Date.now()-t0>5000)loadZX();
}
if(code)onRead(code);
if(scanning)setTimeout(tick,120);
}

function onRead(c){
if(!ean13ok(c))return;
if(c===last)streak++;else{last=c;streak=1}
$('dbg').textContent='읽은 값: '+c;
if(streak<2)return;
const p=byFull.get(c);
if(p){if(navigator.vibrate)navigator.vibrate(60);showResult(p)}
else{
\last='';streak=0;
\msg('등록되지 않은 바코드입니다 ('+c+'). 다시 촬영하거나 아래에서 제품명으로 찾으세요.','err');
}
}

function showResult(p){
stopScan();
$('rname').textContent=p.name;$('rcode').textContent=p.code;
$('cnote').textContent='';$('cnote').className='';
$('res').hidden=false;
msg('');
$('res').scrollIntoView({behavior:'smooth',block:'start'});
}

async function copyCode(){
const t=$('rcode').textContent;let ok=false;
try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
if(!ok){
\try{
\const a=document.createElement('textarea');
\a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';
\document.body.appendChild(a);a.select();a.setSelectionRange(0,99);
\ok=document.execCommand('copy');a.remove();
}catch(e){}
}
$('cnote').textContent=ok?t+' 복사됨. 회사 앱 입력란에 붙여넣으세요.':'복사에 실패했습니다. 위 숫자를 직접 입력하세요.';
$('cnote').className=ok?'ok':'err';
}

function renderList(items,total){
const ul=$('list');ul.innerHTML='';
items.forEach(p=>{
\const li=document.createElement('li'),b=document.createElement('button'),n=document.createElement('b'),s=document.createElement('span');
\n.textContent=p.name;s.textContent='제품 코드 '+p.code;
\b.append(n,s);b.onclick=()=>showResult(p);li.appendChild(b);ul.appendChild(li);
});
if(total>items.length)$('qmsg').textContent='결과 '+total+'개 중 '+items.length+'개만 표시합니다. 더 입력해서 줄이세요.';
}
$('q').addEventListener('input',()=>{
const q=$('q').value.trim();
$('qmsg').textContent='';$('qmsg').className='';$('list').innerHTML='';
if(!q)return;
const flat=q.replace(/[\s-]/g,'');
let hits=[];
if(/^\d+$/.test(flat)){
\if(flat.length>13){$('qmsg').textContent='숫자가 너무 깁니다. 13자리 바코드 숫자를 확인하세요.';$('qmsg').className='err';return}
\if(flat.length===13||flat.length===6){
\const p=lookup(flat);
\if(p)hits=[p];
\else{
$('qmsg').textContent=flat.length===13&&!ean13ok(flat)?'바코드 숫자가 맞지 않습니다. 다시 확인하세요.':'등록되지 않은 번호입니다.';
$('qmsg').className='err';return;
}
}else if(flat.length<3){$('qmsg').textContent='숫자를 3자리 이상 입력하세요.';return}
\else hits=[...byFull].filter(([f,p])=>f.includes(flat)).map(x=>x[1]);
}else{
\const tk=q.toLowerCase().split(/\s+/);
\hits=P.filter(([c,n])=>{const nn=n.toLowerCase().replace(/\s+/g,'');return tk.every(t=>nn.includes(t))}).map(([c,n])=>({code:c,name:n}));
}
if(!hits.length){$('qmsg').textContent='검색 결과가 없습니다. 제품명 일부만 입력해 보세요.';$('qmsg').className='err';return}
renderList(hits.slice(0,40),hits.length);
});

$('start').onclick=startCam;
$('copy').onclick=copyCode;
$('again').onclick=()=>{$('res').hidden=true;$('dbg').textContent='';window.scrollTo({top:0,behavior:'smooth'});startCam()};

if(!P.length)msg('상품 데이터를 불러오지 못했습니다. index.html 파일이 손상되었을 수 있습니다. 다시 올려 주세요.','err');
else $('cnt').textContent='등록 상품 '+P.length+'개';
$('js').hidden=true;
</script>
