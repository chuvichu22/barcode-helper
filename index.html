<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바코드 + 유통기한 + 발주</title>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#51606e;--acc:#0b6e4f;--err:#b3261e;--line:#c9d1d9;--warn:#e67e22;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:12px 14px 50px}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:11px 6px;border:0;border-radius:12px;background:#fff;font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--line)}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
section{display:none}
section.active{display:block}
#box,#obox,#ebox{position:relative;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;margin-top:10px}
video{width:100%;height:100%;object-fit:cover;display:block}
#guide,#oguide,#eguide{position:absolute;left:5%;right:5%;top:25%;bottom:25%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
button{font:inherit;cursor:pointer}
.big{width:100%;min-height:48px;font-size:16px;font-weight:700;border:0;border-radius:12px;background:var(--acc);color:#fff;margin-top:10px}
.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.danger{background:var(--danger);color:#fff}
#msg,#emsg,#omsg{min-height:1.5em;margin:6px 0 0;font-size:14px}
.err{color:var(--err);font-weight:700}.ok{color:var(--acc);font-weight:700}
select,input{width:100%;min-height:44px;font-size:16px;padding:0 12px;border:2px solid var(--line);border-radius:10px;margin-top:6px;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
.card{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;border:1px solid var(--line)}
.card.d3{border-color:var(--danger);background:#fdf2f2}
.card.d7{border-color:var(--warn);background:#fef9f3}
.card.d14{border-color:#f1c40f}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#eee}
.badge.d3{background:var(--danger);color:#fff}
.badge.d7{background:var(--warn);color:#fff}
.badge.d14{background:#f1c40f;color:#000}
.qty{font-size:18px;font-weight:800;color:var(--acc)}
.small{font-size:12px;color:var(--mut)}
.hidden{display:none !important}
ul{list-style:none;margin:8px 0 0;padding:0}
li button{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
#res{background:#fff;border:3px solid var(--acc);border-radius:16px;padding:16px;margin-top:14px;text-align:center}
#rcode{font-size:clamp(44px,16vw,72px);font-weight:800;color:var(--acc);margin:8px 0}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#14202b;color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;font-size:15px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.order-item{padding:10px 0;border-bottom:1px solid var(--line)}
.order-item:last-child{border-bottom:0}
.order-qty{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.order-qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.unit-select{min-height:30px;font-size:12px;padding:0 6px;width:auto;margin:0}
.date-edit{font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;width:120px;min-height:32px;margin:0}
.exp-card{padding:8px 10px;margin-top:6px}
.exp-card .name{font-weight:700;font-size:14px;line-height:1.3}
.exp-card .meta{font-size:11px;color:var(--mut);margin-top:2px}
.exp-actions{display:flex;gap:6px;margin-top:6px;align-items:center}
.exp-actions button{flex:1;min-height:32px;padding:0;border-radius:8px;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff}
.exp-actions .danger{background:var(--danger);color:#fff;border:0;flex:0.9}
.exp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exp-right{text-align:right;flex-shrink:0}
.exp-right .qty{font-size:16px;margin-top:2px}
</style>
</head>
<body>
<main>
<h1>바코드 + 유통기한 + 발주</h1>
<div class="tabs">
<button class="tab active" data-tab="scan">바코드 조회</button>
<button class="tab" data-tab="expiry">유통기한</button>
<button class="tab" data-tab="order">발주 요청</button>
</div>

<section id="tab-scan" class="active">
<div id="box"><video id="v" playsinline webkit-playsinline muted autoplay></video><div id="guide"></div></div>
<button id="start" class="big">카메라 켜기</button>
<p id="msg">상품 데이터를 불러오는 중...</p>
<p id="dbg" class="small"></p>
<div id="res" class="hidden">
<div id="rname" style="font-size:19px;font-weight:700"></div>
<small>회사 앱에 입력할 제품 코드 (뒤 6자리)</small>
<div id="rcode"></div>
<button id="copy" class="big">제품 코드 복사</button>
<p id="cnote"></p>
<button id="again" class="big ghost">다시 스캔</button>
<button id="addToExpiry" class="big" style="margin-top:8px">유통기한 등록으로</button>
</div>
<h2 style="font-size:17px;margin:22px 0 8px">직접 찾기</h2>
<input id="q" type="search" placeholder="제품명 또는 바코드" disabled>
<p id="qmsg"></p>
<ul id="list"></ul>
<p id="cnt" class="small"></p>
</section>

<section id="tab-expiry">
<label>사원</label>
<select id="emp"><option value="">사원 선택</option></select>
<label>대리점</label>
<select id="agency" disabled><option value="">대리점 선택</option></select>
<label>매장 (2차점)</label>
<select id="store" disabled><option value="">매장 선택</option></select>
<label>또는 매장명 직접 입력</label>
<input id="storeCustom" type="text" placeholder="조직도에 없는 매장명 입력">
<div id="storeInfo" class="hidden" style="margin-top:14px">
<strong id="storeTitle" style="display:block;margin-bottom:4px"></strong>
<p id="emsg" class="small"></p>
<div id="expiryList"></div>
<button id="btnAdd" class="big">+ 제품 추가</button>
<button id="btnCopyExpiry" class="big">카톡용 텍스트 복사</button>
</div>
<div id="addPanel" class="card hidden" style="margin-top:14px;padding:14px">
<strong>유통기한 제품 추가</strong>
<button id="btnExpiryScan" class="big" style="margin-top:8px">바코드 스캔하기</button>
<div id="expiryCamBox" class="hidden">
<div id="ebox"><video id="ev" playsinline webkit-playsinline muted autoplay></video><div id="eguide"></div></div>
<p id="escanMsg" class="small">바코드를 네모 칸에 맞추세요</p>
<button id="btnExpiryScanStop" class="big ghost">스캔 종료</button>
</div>
<p style="text-align:center;margin:12px 0 4px;color:var(--mut);font-size:13px">또는 검색으로 찾기</p>
<input id="addSearch" type="search" placeholder="제품명 또는 바코드 검색">
<ul id="addList"></ul>
<div id="e_selected" class="hidden" style="margin-top:10px;padding:10px;background:#f0f7f4;border-radius:10px">
<strong id="e_selName"></strong>
<div class="small" id="e_selCode"></div>
</div>
<label>유통기한</label>
<input id="addDate" type="date">
<label>수량</label>
<input id="addQty" type="number" min="1" value="1">
<button id="btnSaveAdd" class="big">저장</button>
<button id="btnCancelAdd" class="big ghost">취소</button>
</div>
</section>

<section id="tab-order">
<label>사원</label>
<select id="o_emp"><option value="">사원 선택</option></select>
<label>대리점</label>
<select id="o_agency" disabled><option value="">대리점 선택</option></select>
<label>매장 (2차점)</label>
<select id="o_store" disabled><option value="">매장 선택</option></select>
<label>또는 매장명 직접 입력</label>
<input id="o_storeCustom" type="text" placeholder="조직도에 없는 매장명 입력">
<div id="orderArea" class="hidden" style="margin-top:14px">
<strong id="orderStoreTitle" style="display:block;margin-bottom:6px"></strong>
<div id="orderList" class="card" style="min-height:50px;padding:10px 12px">
<p class="small" style="margin:0;text-align:center">아직 담긴 제품이 없습니다</p>
</div>
<button id="btnOrderAdd" class="big">+ 제품 추가</button>
<button id="btnCopyOrder" class="big">카톡용 텍스트 복사</button>
<button id="btnClearOrder" class="big ghost">목록만 비우기</button>
<button id="btnResetAll" class="big danger">전체 초기화</button>
<p id="omsg" class="small"></p>
</div>
<div id="orderAddPanel" class="card hidden" style="margin-top:14px;padding:14px">
<strong>발주 제품 추가</strong>
<button id="btnOrderScan" class="big" style="margin-top:8px">바코드 스캔하기</button>
<div id="orderCamBox" class="hidden">
<div id="obox"><video id="ov" playsinline webkit-playsinline muted autoplay></video><div id="oguide"></div></div>
<p id="oscanMsg" class="small">바코드를 네모 칸에 맞추세요</p>
<button id="btnOrderScanStop" class="big ghost">스캔 종료</button>
</div>
<p style="text-align:center;margin:12px 0 4px;color:var(--mut);font-size:13px">또는 검색으로 찾기</p>
<input id="o_search" type="search" placeholder="제품명 또는 바코드 검색">
<ul id="o_list"></ul>
<div id="o_selected" class="hidden" style="margin-top:10px;padding:10px;background:#f0f7f4;border-radius:10px">
<strong id="o_selName"></strong>
<div class="small" id="o_selCode"></div>
</div>
<label>수량 유형</label>
<select id="o_unit">
<option value="qty">수량 (개)</option>
<option value="box">박스</option>
<option value="remain">잔여수량</option>
<option value="soldout">품절</option>
<option value="none">품목만 (수량 없음)</option>
</select>
<div id="o_qtyWrap">
<label>수량</label>
<input id="o_qty" type="number" min="1" value="1">
</div>
<button id="btnOrderSave" class="big">담기</button>
<button id="btnOrderCancel" class="big ghost">취소</button>
</div>
</section>
</main>
<div id="toast">저장되었습니다</div>

<script>
const PRODUCT_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTk2c--28hH4VkUe84z4rkFIdL_qACQt_vSyLsvDjSqYw8b6eJFLcRPTzK0eWC1ue4OsVKPL5UclV2U/pub?output=csv';
const ORG_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQODEz9RyQlO5e40idNtJ5vPOLpcCPs4tmpZwuROBjKI2mPs9AUzeVJOyT9PsRBWzD8Vxya5dR24-Bj/pub?output=csv';
const STOCK_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1S4DfOszr0CX5KI0ud2T6pK786qESXmiO8bHaXaDQyUtJEi01oW_VIthc8Q7gmmIM2BPN2bKRWY1-/pub?output=csv';
const PREFIX = '8801005';
const LOCAL_KEY = 'expiry_stock_v1';
const ORDER_KEY = 'order_temp_v1';
const ORDER_SEL_KEY = 'order_selection_v1';

const $ = id => document.getElementById(id);
const msg = (t,c) => { $('msg').textContent = t; $('msg').className = c || ''; };
const emsg = (t,c) => { $('emsg').textContent = t; $('emsg').className = c || ''; };
const omsg = (t,c) => { $('omsg').textContent = t; $('omsg').className = c || ''; };
const digits = s => String(s || '').replace(/\D/g, '');

function showToast(text) {
if (!text) text = '저장되었습니다';
const t = $('toast');
t.textContent = text;
t.classList.add('show');
setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function parseCSV(text) {
const rows = [];
text.trim().split(/\r?\n/).forEach(function(line, i) {
\if (i === 0) return;
\const cols = [];
\var cur = '', q = false;
\for (var j = 0; j < line.length; j++) {
\var ch = line[j];
\if (ch === '"') { q = !q; continue; }
\if (ch === ',' && !q) { cols.push(cur.trim()); cur = ''; continue; }
\cur += ch;
}
\cols.push(cur.trim());
\if (cols.length) rows.push(cols);
});
return rows;
}

function daysLeft(dateStr) {
if (!dateStr) return 9999;
var d = new Date(dateStr);
var today = new Date();
today.setHours(0, 0, 0, 0);
return Math.ceil((d - today) / 86400000);
}

function formatUnit(item) {
if (item.unit === 'soldout') return '품절';
if (item.unit === 'none') return '';
if (item.unit === 'box') return (item.qty || 1) + '박스';
if (item.unit === 'remain') return '잔여 ' + (item.qty || 1) + '개';
return (item.qty || 1) + '개';
}

var PRODUCTS = [], byFull = new Map(), byCode = new Map(), ORG = [], STOCK = [], ORDER = [];

function loadLocal() {
try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); }
catch (e) { return []; }
}
function saveLocal(data) { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }
function loadOrder() {
try { return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]'); }
catch (e) { return []; }
}
function saveOrder(data) { localStorage.setItem(ORDER_KEY, JSON.stringify(data)); ORDER = data; }
function saveOrderSelection() {
localStorage.setItem(ORDER_SEL_KEY, JSON.stringify({
\emp: $('o_emp').value,
\agency: $('o_agency').value,
\store: $('o_store').value,
\storeCustom: $('o_storeCustom').value
}));
}
function loadOrderSelection() {
try { return JSON.parse(localStorage.getItem(ORDER_SEL_KEY) || '{}'); }
catch (e) { return {}; }
}

function mergeStock(sheet, local) {
var map = new Map();
sheet.forEach(function(s) {
\map.set([s.emp, s.agency, s.store, s.code, s.expiry].join('|'), s);
});
local.forEach(function(s) {
\map.set([s.emp, s.agency, s.store, s.code, s.expiry].join('|'), Object.assign({}, s, { source: 'local' }));
});
return Array.from(map.values());
}

function buildEmpSelect(id) {
var emps = Array.from(new Set(ORG.map(function(o){ return o.emp; }))).sort();
var sel = $(id);
sel.innerHTML = '<option value="">사원 선택</option>';
emps.forEach(function(e) {
\var o = document.createElement('option');
\o.value = e; o.textContent = e;
\sel.appendChild(o);
});
}

function getStoreName(selectId, customId) {
var custom = $(customId).value.trim();
if (custom) return custom;
return $(selectId).value;
}

async function init() {
try {
\msg('데이터를 불러오는 중...');
\var results = await Promise.all([
\fetch(PRODUCT_CSV + '&=' + Date.now()).then(function(r){ return r.text(); }),
\fetch(ORG_CSV + '&=' + Date.now()).then(function(r){ return r.text(); }),
\fetch(STOCK_CSV + '&_=' + Date.now()).then(function(r){ return r.text(); }).catch(function(){ return ''; })
]);
\var pText = results[0], oText = results[1], sText = results[2];

\PRODUCTS = parseCSV(pText).map(function(r) {
\var code = digits(r[0]).slice(-6);
\return [code, r[1] || ''];
}).filter(function(x){ return x[0].length === 6; });

\byFull = new Map(PRODUCTS.map(function(pair) {
\return [PREFIX + pair[0], { code: pair[0], name: pair[1] }];
}));
\byCode = new Map(PRODUCTS.map(function(pair) {
\return [pair[0], { code: pair[0], name: pair[1] }];
}));
$('cnt').textContent = '등록 상품 ' + PRODUCTS.length + '개';
$('q').disabled = false;

\ORG = parseCSV(oText).map(function(r) {
\return { emp: r[0] || '', agency: r[1] || '', store: r[2] || '' };
}).filter(function(x){ return x.emp; });

\var sheetStock = parseCSV(sText).map(function(r) {
\return {
\emp: r[0] || '', agency: r[1] || '', store: r[2] || '',
\code: digits(r[3]).slice(-6), name: r[4] || '', expiry: r[5] || '',
\qty: parseInt(r[6], 10) || 0, source: 'sheet'
};
}).filter(function(x){ return x.code; });

\STOCK = mergeStock(sheetStock, loadLocal());
\ORDER = loadOrder();
\buildEmpSelect('emp');
\buildEmpSelect('o_emp');
\restoreOrderSelection();
\msg('카메라를 켜고 바코드를 네모 칸에 맞추세요.');
} catch (e) {
\console.error(e);
\msg('데이터를 불러오지 못했습니다.', 'err');
}
}

function restoreOrderSelection() {
var sel = loadOrderSelection();
if (!sel.emp) return;
var hasEmp = Array.from($('o_emp').options).some(function(o){ return o.value === sel.emp; });
if (!hasEmp) return;
$('o_emp').value = sel.emp;
var agencies = Array.from(new Set(ORG.filter(function(o){ return o.emp === sel.emp; }).map(function(o){ return o.agency; }))).sort();
var agencySel = $('o_agency');
agencySel.innerHTML = '<option value="">대리점 선택</option>';
agencies.forEach(function(a) {
\var o = document.createElement('option');
\o.value = a; o.textContent = a;
\agencySel.appendChild(o);
});
agencySel.disabled = false;
if (sel.agency && agencies.indexOf(sel.agency) >= 0) {
\agencySel.value = sel.agency;
\var stores = Array.from(new Set(ORG.filter(function(o){ return o.emp === sel.emp && o.agency === sel.agency; }).map(function(o){ return o.store; }))).sort();
\var storeSel = $('o_store');
\storeSel.innerHTML = '<option value="">매장 선택</option>';
\stores.forEach(function(s) {
\var o = document.createElement('option');
\o.value = s; o.textContent = s;
\storeSel.appendChild(o);
});
\storeSel.disabled = false;
\if (sel.store && stores.indexOf(sel.store) >= 0) storeSel.value = sel.store;
}
if (sel.storeCustom) $('o_storeCustom').value = sel.storeCustom;
var storeName = getStoreName('o_store', 'o_storeCustom');
if (storeName) {
$('orderArea').classList.remove('hidden');
$('orderStoreTitle').textContent = storeName;
\renderOrderList();
}
}

function setupOrgSelect(empId, agencyId, storeId, customId, areaId, titleId, onShow, isOrder) {
$(empId).onchange = function() {
\var emp = $(empId).value;
\var agencies = Array.from(new Set(ORG.filter(function(o){ return o.emp === emp; }).map(function(o){ return o.agency; }))).sort();
\var sel = $(agencyId);
\sel.innerHTML = '<option value="">대리점 선택</option>';
\agencies.forEach(function(a) {
\var o = document.createElement('option');
\o.value = a; o.textContent = a;
\sel.appendChild(o);
});
\sel.disabled = !emp;
$(storeId).innerHTML = '<option value="">매장 선택</option>';
$(storeId).disabled = true;
$(customId).value = '';
$(areaId).classList.add('hidden');
\if (isOrder) saveOrderSelection();
};
$(agencyId).onchange = function() {
\var emp = $(empId).value, agency = $(agencyId).value;
\var stores = Array.from(new Set(ORG.filter(function(o){ return o.emp === emp && o.agency === agency; }).map(function(o){ return o.store; }))).sort();
\var sel = $(storeId);
\sel.innerHTML = '<option value="">매장 선택</option>';
\stores.forEach(function(s) {
\var o = document.createElement('option');
\o.value = s; o.textContent = s;
\sel.appendChild(o);
});
\sel.disabled = !agency;
$(customId).value = '';
$(areaId).classList.add('hidden');
\if (isOrder) saveOrderSelection();
};
$(storeId).onchange = function() {
$(customId).value = '';
\checkShow();
\if (isOrder) saveOrderSelection();
};
$(customId).oninput = function() {
\if ($(customId).value.trim()) $(storeId).value = '';
\checkShow();
\if (isOrder) saveOrderSelection();
};
function checkShow() {
\var name = getStoreName(storeId, customId);
\if (name) {
$(areaId).classList.remove('hidden');
$(titleId).textContent = name;
\if (onShow) onShow();
} else {
$(areaId).classList.add('hidden');
}
}
}

setupOrgSelect('emp', 'agency', 'store', 'storeCustom', 'storeInfo', 'storeTitle', renderExpiryList, false);
setupOrgSelect('o_emp', 'o_agency', 'o_store', 'o_storeCustom', 'orderArea', 'orderStoreTitle', renderOrderList, true);

function getCurrentExpiryList() {
var emp = $('emp').value;
var agency = $('agency').value || '-';
var store = getStoreName('store', 'storeCustom');

function ean13ok(s) {
if (!/^\d{13}$/.test(s)) return false;
var d = s.split('').map(Number);
var t = 0;
for (var i = 0; i < 12; i++) t += d[i] * (i % 2 ? 3 : 1);
return (10 - t % 10) % 10 === d[12];
}

scanning = false;
try { $('v').pause(); } catch (e) {}
}

async function readBD(v) {
var r = await bd.detect(v);
for (var i = 0; i < r.length; i++) {
\var d = digits(r[i].rawValue);
\if (d.length === 13) return d;
}
return null;
}

function readZX(v) {
var W = v.videoWidth, H = v.videoHeight;
var sw = Math.round(W * 0.9), sh = Math.round(H * 0.5);
var k = Math.min(1, 1000 / sw);
cv.width = Math.round(sw * k);
cv.height = Math.round(sh * k);
cx.drawImage(v, (W - sw) >> 1, (H - sh) >> 1, sw, sh, 0, 0, cv.width, cv.height);
try {
\var b = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)));
\return digits(zx.decode(b).getText());
} catch (e) {
\return null;
}
}

async function tick() {
if (!scanning) return;
var v = $('v');
var code = null;
if (v.readyState >= 2 && v.videoWidth) {
\try { if (bd) code = await readBD(v); } catch (e) { bd = false; loadZX(); }
\if (!code && zx) code = readZX(v);
\if (!code && !zx && Date.now() - t0 > 5000) loadZX();
}
if (code) onRead(code);
if (scanning) setTimeout(tick, 120);
}

function onRead(c) {
if (!ean13ok(c)) return;
if (c === last) streak++;
else { last = c; streak = 1; }
$('dbg').textContent = '읽은 값: ' + c;
if (streak < 2) return;
var p = byFull.get(c);
if (p) {
\if (navigator.vibrate) navigator.vibrate(60);
\showResult(p);
} else {
\last = '';
\streak = 0;
\msg('등록되지 않은 바코드입니다 (' + c + ')', 'err');
}
}

function showResult(p) {

$('rname').textContent = p.name;
$('rcode').textContent = p.code;

msg('');

}
